<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="Seoul to Virginia Region and Chicago Local Zone latency test">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00d4aa"/>
    </marker>
  </defs>

  <rect width="960" height="620" fill="url(#bg)" rx="12"/>

  <text x="480" y="34" text-anchor="middle" font-family="monospace, Courier, sans-serif" font-size="17" fill="#ffffff" font-weight="bold">서울 → Virginia Region vs Chicago Local Zone</text>
  <text x="480" y="56" text-anchor="middle" font-family="monospace, Courier, sans-serif" font-size="11" fill="#888888">installer --target virginia|chicago · TCP SYN RTT · delaytest.py</text>

  <!-- Seoul -->
  <rect x="36" y="90" width="250" height="300" rx="10" fill="#0d2235" stroke="#00a8ff" stroke-width="2"/>
  <text x="161" y="118" text-anchor="middle" font-family="monospace, Courier, sans-serif" font-size="13" fill="#00ccff" font-weight="bold">시험장소: 서울</text>
  <text x="161" y="138" text-anchor="middle" font-family="monospace, Courier, sans-serif" font-size="10" fill="#6688aa">14.32.157.162</text>

  <rect x="56" y="160" width="210" height="58" rx="8" fill="#0a1830" stroke="#00a8ff" stroke-width="1.5"/>
  <text x="161" y="185" text-anchor="middle" font-family="monospace, Courier, sans-serif" font-size="12" fill="#ffffff" font-weight="bold">delaytest.py</text>
  <text x="161" y="205" text-anchor="middle" font-family="monospace, Courier, sans-serif" font-size="10" fill="#88aacc">--target all · 30 probes</text>

  <rect x="56" y="238" width="210" height="58" rx="8" fill="#0a1830" stroke="#00d4aa" stroke-width="1.5"/>
  <text x="161" y="263" text-anchor="middle" font-family="monospace, Courier, sans-serif" font-size="12" fill="#ffffff" font-weight="bold">Python TCP RTT</text>
  <text x="161" y="283" text-anchor="middle" font-family="monospace, Courier, sans-serif" font-size="10" fill="#88aacc">SYN → SYN-ACK / RST</text>

  <rect x="56" y="316" width="210" height="50" rx="8" fill="#0a1830" stroke="#aa88ff" stroke-width="1.5"/>
  <text x="161" y="346" text-anchor="middle" font-family="monospace, Courier, sans-serif" font-size="11" fill="#ccbbee">comparison-latest.json</text>

  <!-- Internet -->
  <rect x="320" y="170" width="160" height="140" rx="10" fill="#12122a" stroke="#555577" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="400" y="210" text-anchor="middle" font-family="monospace, Courier, sans-serif" font-size="12" fill="#ffdd44" font-weight="bold">Internet</text>
  <text x="400" y="235" text-anchor="middle" font-family="monospace, Courier, sans-serif" font-size="10" fill="#9999aa">ISP → Backbone</text>
  <text x="400" y="255" text-anchor="middle" font-family="monospace, Courier, sans-serif" font-size="10" fill="#9999aa">→ AWS Edge</text>
  <text x="400" y="285" text-anchor="middle" font-family="monospace, Courier, sans-serif" font-size="10" fill="#00d4aa">TCP SYN ↔</text>

  <line x1="286" y1="240" x2="320" y2="240" stroke="#00d4aa" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- AWS box -->
  <rect x="510" y="80" width="420" height="360" rx="10" fill="#1a1508" stroke="#ff9900" stroke-width="2"/>
  <text x="720" y="108" text-anchor="middle" font-family="monospace, Courier, sans-serif" font-size="13" fill="#ff9900" font-weight="bold">AWS us-east-1</text>
  <text x="720" y="128" text-anchor="middle" font-family="monospace, Courier, sans-serif" font-size="10" fill="#aa8866">Shared SG · TCP 22/80/443 from Seoul IP</text>

  <!-- Virginia -->
  <rect x="535" y="150" width="370" height="120" rx="8" fill="#221808" stroke="#ff9900" stroke-width="1.5"/>
  <text x="720" y="178" text-anchor="middle" font-family="monospace, Courier, sans-serif" font-size="12" fill="#ffaa00" font-weight="bold">1) Region (Virginia)</text>
  <text x="720" y="200" text-anchor="middle" font-family="monospace, Courier, sans-serif" font-size="11" fill="#ffffff">EC2 t3.micro · us-east-1a</text>
  <text x="720" y="220" text-anchor="middle" font-family="monospace, Courier, sans-serif" font-size="10" fill="#ccaa88">54.152.1.164</text>
  <text x="720" y="248" text-anchor="middle" font-family="monospace, Courier, sans-serif" font-size="12" fill="#00d4aa" font-weight="bold">RTT avg ≈ 203 ms</text>

  <!-- Chicago -->
  <rect x="535" y="290" width="370" height="120" rx="8" fill="#221808" stroke="#00d4aa" stroke-width="1.5"/>
  <text x="720" y="318" text-anchor="middle" font-family="monospace, Courier, sans-serif" font-size="12" fill="#00d4aa" font-weight="bold">2) Local Zone (Chicago)</text>
  <text x="720" y="340" text-anchor="middle" font-family="monospace, Courier, sans-serif" font-size="11" fill="#ffffff">EC2 c6i.large · us-east-1-chi-2a</text>
  <text x="720" y="360" text-anchor="middle" font-family="monospace, Courier, sans-serif" font-size="10" fill="#ccaa88">16.56.136.129</text>
  <text x="720" y="388" text-anchor="middle" font-family="monospace, Courier, sans-serif" font-size="12" fill="#00ff88" font-weight="bold">RTT avg ≈ 190 ms (−13 ms)</text>

  <line x1="480" y1="210" x2="510" y2="210" stroke="#00d4aa" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="350" x2="510" y2="350" stroke="#00d4aa" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Footer -->
  <rect x="36" y="470" width="894" height="120" rx="8" fill="#101028" stroke="#444466" stroke-width="1"/>
  <text x="56" y="500" text-anchor="start" font-family="monospace, Courier, sans-serif" font-size="12" fill="#ff9900" font-weight="bold">installer.py</text>
  <text x="180" y="500" text-anchor="start" font-family="monospace, Courier, sans-serif" font-size="11" fill="#ccccdd">--target virginia | chicago | all  → config.json</text>
  <text x="56" y="528" text-anchor="start" font-family="monospace, Courier, sans-serif" font-size="12" fill="#00d4aa" font-weight="bold">비교</text>
  <text x="180" y="528" text-anchor="start" font-family="monospace, Courier, sans-serif" font-size="11" fill="#ccccdd">서울 기준 Chicago LZ가 Virginia Region보다 TCP22 avg ~13ms 낮음</text>
  <text x="56" y="556" text-anchor="start" font-family="monospace, Courier, sans-serif" font-size="12" fill="#aa88ff" font-weight="bold">참고</text>
  <text x="180" y="556" text-anchor="start" font-family="monospace, Courier, sans-serif" font-size="11" fill="#ccccdd">둘 다 ~190–200ms대 — 대륙 횡단 지연이 대부분. 현지(시카고) 사용자에게 LZ 이득이 큼</text>
</svg>
